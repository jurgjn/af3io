# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AF3IO_TEST_DATA: ${{ github.workspace }}/.af3io-test-data # pooch cache for test data, see test_data_registry.txt

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        python -m pip install -e ".[test]"
    - name: Cache test data
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.af3io-test-data
        key: af3io-test-data-${{ hashFiles('test_data_registry.txt') }}
        restore-keys: af3io-test-data-
    - name: Test with pytest
      run: |
        pytest

  coverage:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "genbadge[coverage]"
        python -m pip install -e ".[test]"
    - name: Cache test data
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.af3io-test-data
        key: af3io-test-data-${{ hashFiles('test_data_registry.txt') }}
        restore-keys: af3io-test-data-
    - name: Run tests with coverage
      run: |
        pytest --cov=af3io --cov-report=term-missing --cov-report=xml
    - name: Generate coverage badge
      run: |
        mkdir -p .github/badges
        genbadge coverage -i coverage.xml -o .github/badges/coverage.svg
    - name: Commit coverage badge
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update coverage badge"
        file_pattern: .github/badges/coverage.svg
